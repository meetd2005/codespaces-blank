  # ---- Disclaimer (markdown) ------------------------------------------------
  disclaimer: |
    This report reflects a point-in-time assessment of the target environment
    during the examination window and does not guarantee that every weakness
    present was identified. The absence of a finding for a given system or
    control should not be interpreted as evidence that no weakness exists.

    All testing was performed against a dedicated lab environment provided for
    training and certification purposes. The techniques described are documented
    to enable the defender to reproduce, understand and remediate the underlying
    misconfigurations. This document is **CONFIDENTIAL**.

