  # ---- Executive Summary (markdown) -----------------------------------------
  executive_summary: |
    This report documents a full red team assessment of the **`tech.corp`**
    Active Directory domain and its bidirectional forest trust with
    **`finance.corp`**, performed as part of the Certified Red Team
    Professional (CRTP) examination. Testing began from an assumed-breach
    position: a single low-privileged user, `tech\studentuser`, on the foothold
    workstation **STUDVM**. No exploit of unpatched software was used at any
    point. Every step abused a legitimate Windows or Active Directory feature
    that had been left in an insecure configuration.

    From that starting point we obtained **complete control of the `tech.corp`
    domain** and then **pivoted across the forest trust to compromise
    `finance.corp`**, retrieving the final objective flag from the desktop of a
    privileged account on the `finance.corp` domain controller. The compromise
    was achieved by chaining the following weaknesses, each ordinary on its own
    but devastating in sequence:

    - **Cleartext credentials in a readable file share** gave the first
      privilege escalation on the foothold host.
    - **No LAPS and reused local administrator rights** allowed credential theft
      from LSASS and lateral movement between member servers.
    - **Resource-Based Constrained Delegation (RBCD)** that a machine account
      could configure on itself let us impersonate a Domain Admin to a
      management server.
    - **Dangerous Active Directory ACLs** (self-membership into privileged
      groups, and force-password-reset rights over another user) extended access
      without ever cracking a password.
    - **An Active Directory Certificate Services misconfiguration (ESC3)** turned
      a low-privileged certificate enrollment right into a Domain Admin logon.
    - **A forest trust without effective SID filtering on the outbound path**
      allowed a forged inter-realm ticket to be honoured by `finance.corp`.

    Overall posture is assessed as **Critical**. A single foothold credential was
    sufficient to reach Enterprise Admin in `tech.corp` (the `techadmin` account
    is a member of both Domain Admins and Enterprise Admins) and to cross the
    trust boundary into a second forest. The recommendations prioritise the
    changes that break the *earliest* links in this chain, because doing so
    collapses everything downstream of them.

  # ---- Conclusion (markdown). Rendered as its own section near the end. ------
  conclusion: |
    The `tech.corp` domain can be fully compromised by any attacker who obtains a
    single standard domain credential, and that compromise does not stop at the
    domain boundary. It extends across the forest trust into `finance.corp`. The
    path required no software vulnerability; it was made possible entirely by
    identity, delegation, certificate-services and trust misconfigurations.

    Remediation should be sequenced by attack-path impact rather than by treating
    each finding in isolation:

    1. **Remove secrets from file shares and deploy LAPS.** This eliminates the
       initial foothold escalation and the credential reuse that followed it.
    2. **Audit and remove dangerous delegation and ACLs.** RBCD write rights,
       self-membership and force-password-reset ACEs on privileged objects were
       the backbone of the domain takeover.
    3. **Harden AD CS.** Remove the ESC3 enrollment-agent capability and enforce
       manager approval; this closes the certificate path to Domain Admin.
    4. **Enforce SID filtering / quarantine on the forest trust.** This is the
       control that would have stopped the cross-forest pivot.

    Applying items 1 and 2 alone would have halted this assessment before Domain
    Admin was reached. They should be treated as immediate priorities.

  # ---- Methodology (markdown). The diagram ships with the design. -----------
  methodology: |
    ![](/assets/name/methodology.png){width="auto"}

    The assessment followed an assumed-breach methodology aligned with the MITRE
    ATT&CK framework. Beginning with the credentials of a single low-privileged
    domain user, testing progressed through the following phases:

    - **Reconnaissance and Enumeration:** mapping users, groups, computers, ACLs,
      certificate templates, delegation and trusts using adPEAS, PowerView and
      BloodHound.
    - **Privilege Escalation:** abusing file-share secrets, delegation (RBCD),
      dangerous ACLs and AD CS (ESC3).
    - **Credential Access:** extracting secrets from LSASS, the SAM and LSA
      secrets with an evasive build of Mimikatz.
    - **Lateral Movement:** replaying harvested hashes and Kerberos tickets
      across hosts (Over-Pass-the-Hash, S4U, Pass-the-Ticket).
    - **Domain and Forest Dominance:** reaching Domain and Enterprise Admin in
      `tech.corp` and pivoting across the trust into `finance.corp`.

  # ---- Objective (markdown). Optional; appears under Methodology. ------------
  objective: |
    The goal of the assessment was to identify and exploit misconfigurations in
    the environment, assuming all hosts carry current security patches and that
    Microsoft Defender is enabled. For each machine in scope the objective was to
    obtain and prove operating-system-level command execution, and to document
    the complete path of compromise across the `tech.corp` domain and its trust
    with `finance.corp`.

    **Assessment goal:** Compromise the machines in scope, prove OS-level command
    execution on each, and retrieve the final objective flag from `finance.corp`.

  # ---- Scope (markdown) -----------------------------------------------------
  scope: |
    **Targeted Systems:**

    | Hostname | Role | Domain |
    |:---|:---|:---|
    | STUDVM | Foothold workstation (assumed breach) | tech.corp |
    | TECH-DC | Domain Controller / AD CS Certificate Authority | tech.corp |
    | MGMTSRV | Management server (RBCD target) | tech.corp |
    | TECHSRV30 | Application server | tech.corp |
    | ADMINSRV86 | Administration server | tech.corp |
    | FINANCE-DC | Forest-root Domain Controller | finance.corp |

    **Forest trust:** `tech.corp` to `finance.corp`, Bidirectional, Transitive,
    marked `QUARANTINED_DOMAIN` (SID filtering enabled on the trust).

  # ---- Provided access (markdown) -------------------------------------------
  provided_user_machine: |
    | User Name | Machine Name |
    | :--- | :--- |
    | `tech\studentuser` | STUDVM |

  # ---- Disclaimer (markdown) ------------------------------------------------
  disclaimer: |
    This report reflects a point-in-time assessment of the target environment
    during the examination window and does not guarantee that every weakness
    present was identified. The absence of a finding for a given system or
    control should not be interpreted as evidence that no weakness exists.

    All testing was performed against a dedicated lab environment provided for
    training and certification purposes. The techniques described are documented
    to enable the defender to reproduce, understand and remediate the underlying
    misconfigurations. This document is **CONFIDENTIAL**.

